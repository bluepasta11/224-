<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>224 이민 신청서</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23191310'/%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23ff7a1a' stroke-width='3'/%3E%3Ctext x='32' y='40' font-family='Arial, sans-serif' font-size='22' font-weight='700' fill='%23ffb648' text-anchor='middle'%3E224%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#131010;
    --bg2:#1a1512;
    --panel:#1f1a15;
    --panel2:#28211a;
    --line:#3d3024;
    --line-soft:#2a2119;
    --accent:#ff7a1a;
    --accent2:#ffb648;
    --accent-deep:#b5480a;
    --text:#f4ede0;
    --text-dim:#b3a48d;
    --text-faint:#726554;
    --ok:#8bd35c;
    --danger:#e2564a;
    --console:#39d97a;
    --console-dim:#1d7f4a;
    --tier-elite:#ff9d42;
    --tier-high:#c583e8;
    --tier-mid:#3ec6ea;
    --tier-low:#9aa3ab;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,122,26,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR','Noto Sans JP','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 10px);
    pointer-events:none;
  }
  .num{font-family:'Oswald','Noto Sans KR',sans-serif;}
  .scene{max-width:600px;margin:0 auto;padding-bottom:70px;}

  /* ---- banner ---- */
  .banner{
    position:relative;
    padding:16px 18px 34px;
    background:linear-gradient(160deg,#241a11 0%, #1a1310 65%);
    border-bottom:1px solid var(--line);
    clip-path:polygon(0 0,100% 0,100% 88%,0 100%);
  }
  .banner-top{display:flex;align-items:center;justify-content:flex-end;}
  .langbar{display:flex;gap:6px;}
  .langbtn{
    font-family:'Oswald',sans-serif;
    padding:7px 12px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-faint);
    font-size:12px;font-weight:600;letter-spacing:0.03em;
    cursor:pointer;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 5px 100%, 0 calc(100% - 5px));
    transition:all .15s;
  }
  .langbtn.active{border-color:var(--accent);color:var(--accent2);background:rgba(255,122,26,0.1);}
  .langbtn:hover:not(.active){color:var(--text);border-color:#54432f;}

  /* ---- emblem ---- */
  .emblem-wrap{display:flex;justify-content:center;margin-top:-46px;position:relative;z-index:3;}
  .emblem{
    width:104px;height:104px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #2c2118, #171310 70%);
    border:2px solid var(--accent);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 0 0 5px var(--bg), 0 14px 30px -8px rgba(0,0,0,0.7);
    position:relative;
  }
  .emblem::before{
    content:"";position:absolute;inset:-9px;border-radius:50%;
    border:1.5px dashed rgba(255,122,26,0.4);
    animation:spin 50s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .emblem-number{font-family:'Oswald',sans-serif;font-size:27px;font-weight:700;color:var(--accent2);letter-spacing:0.02em;line-height:1;}
  .emblem-tag{font-size:9.5px;color:var(--text-faint);margin-top:4px;letter-spacing:0.04em;}

  /* ---- hero ---- */
  .hero{text-align:center;padding:26px 24px 0;}
  .title{margin:0 0 22px;}
  .title-num{
    display:block;
    font-family:'Oswald',sans-serif;
    font-size:76px;font-weight:700;line-height:0.95;
    background:linear-gradient(180deg,var(--accent2),var(--accent-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:-0.01em;
  }
  .title-rest{
    display:block;
    font-size:17px;font-weight:700;color:var(--text);
    margin-top:6px;letter-spacing:0.01em;
  }
  .route{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .route-chip{
    font-family:'Oswald',sans-serif;
    font-size:12.5px;font-weight:600;letter-spacing:0.02em;
    padding:8px 14px;border:1px solid var(--line);color:var(--text-dim);
    clip-path:polygon(0 0, 100% 0, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  }
  .route-chip.to{border-color:var(--accent);color:var(--accent2);background:rgba(255,122,26,0.08);}
  .route-arrow{color:var(--text-faint);font-size:16px;}
  .designed{font-size:12px;color:var(--text-faint);margin:0 0 6px;}
  .designed b{color:var(--accent2);font-weight:700;}

  /* ---- tear ---- */
  .tear{
    height:20px;margin:26px 20px 0;
    background-image:radial-gradient(circle, var(--bg) 3.5px, transparent 3.6px);
    background-size:16px 20px;background-position:top center;background-repeat:repeat-x;
    border-top:1px dashed var(--line);
  }

  /* ---- doc card ---- */
  .doc-card{
    margin:0 16px 22px;
    background:var(--panel);
    border:1px solid var(--line);
    border-top:none;
    padding:30px 22px 26px;
    clip-path:polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
  }

  .step{display:flex;align-items:center;gap:12px;margin:0 0 22px;}
  .step:not(:first-child){margin-top:8px;}
  .step-badge{
    font-family:'Oswald',sans-serif;
    width:30px;height:30px;border-radius:50%;
    border:1.5px solid var(--accent);
    color:var(--accent2);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;flex-shrink:0;
  }
  .step-badge.alt{border-color:#55606a;color:#9fb0bc;}
  .step-title{font-size:15px;font-weight:700;color:var(--text);}
  .step-rule{flex:1;height:1px;background:var(--line);}

  label.field-label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:7px;font-weight:500;}
  label.field-label .req{color:var(--accent);margin-left:3px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:420px){.row2{grid-template-columns:1fr;}}

  input[type=text]{
    width:100%;background:var(--bg2);border:1px solid var(--line);
    padding:12px 13px;color:var(--text);font-size:15px;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input::placeholder{color:var(--text-faint);}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,0.14);}
  input.invalid{border-color:var(--danger);}
  #f_uid{font-family:'JetBrains Mono',monospace;letter-spacing:0.06em;font-size:14px;padding-right:52px;}

  .field{margin-bottom:18px;}
  .uid-wrap{position:relative;}
  .uid-counter{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}

  .warnbox{
    background:rgba(226,86,74,0.08);border:1px solid rgba(226,86,74,0.3);
    padding:12px 14px;font-size:12.5px;line-height:1.65;color:#e79a92;margin-bottom:8px;
  }

  .troop-group{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .alliance-group{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;}
  .alliance-btn{padding:11px 6px;}
  .app-alliance-tag{font-size:9.5px;color:#3ec6ea;border:1px solid #245a68;padding:1px 5px;white-space:nowrap;flex-shrink:0;}
  .troop-btn{
    background:var(--bg2);border:1px solid var(--line);
    padding:14px 6px 12px;color:var(--text-dim);
    display:flex;flex-direction:column;align-items:center;gap:7px;
    cursor:pointer;font-size:12.5px;font-weight:600;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    transition:all .15s;
  }
  .troop-btn svg{width:22px;height:22px;stroke:var(--text-faint);fill:none;stroke-width:1.7;transition:stroke .15s;}
  .troop-btn.selected{border-color:var(--accent);background:rgba(255,122,26,0.1);color:var(--accent2);}
  .troop-btn.selected svg{stroke:var(--accent2);}
  .troop-btn:hover:not(.selected){border-color:#54432f;color:var(--text);}

  .errmsg{color:var(--danger);font-size:11.5px;margin-top:6px;display:none;}
  .score-preview{font-size:11.5px;margin-top:7px;display:none;font-family:'Oswald',sans-serif;letter-spacing:0.01em;}
  .score-preview.show{display:block;}
  .score-preview .tier-tag-s{color:var(--tier-elite);}
  .score-preview .tier-tag-a{color:var(--tier-high);}
  .score-preview .tier-tag-b{color:var(--tier-mid);}
  .score-preview .tier-tag-c{color:var(--tier-low);}
  .errmsg.show{display:block;}

  .submit-btn{
    width:100%;margin-top:8px;
    background:linear-gradient(135deg,var(--accent2),var(--accent-deep));
    border:none;padding:15px;color:#1a1310;font-size:15.5px;font-weight:700;
    cursor:pointer;letter-spacing:0.01em;
    clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition:filter .15s, transform .1s;
  }
  .submit-btn:hover{filter:brightness(1.07);}
  .submit-btn:active{transform:scale(0.99);}

  /* ---- success ---- */
  .success{text-align:center;padding:6px 0 4px;}
  .stamp-wrap{display:flex;justify-content:center;margin-bottom:22px;}
  .stamp{
    width:112px;height:112px;border-radius:50%;
    border:3px double var(--ok);
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-9deg);
    color:var(--ok);
    font-family:'Oswald',sans-serif;
    font-size:15px;font-weight:700;letter-spacing:0.04em;
    text-align:center;line-height:1.3;
    animation:stampIn .35s cubic-bezier(.2,1.4,.4,1);
    padding:8px;
  }
  @keyframes stampIn{from{transform:rotate(-9deg) scale(1.7);opacity:0;}to{transform:rotate(-9deg) scale(1);opacity:1;}}
  .success h3{font-size:19px;margin:0 0 8px;font-weight:800;}
  .success p{color:var(--text-dim);font-size:13.5px;margin:0 0 22px;}
  .summary{text-align:left;background:var(--bg2);border:1px solid var(--line);padding:15px 17px;margin-bottom:20px;font-size:13.5px;}
  .summary div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-soft);}
  .summary div:last-child{border-bottom:none;}
  .summary span:first-child{color:var(--text-dim);}
  .summary span:last-child{color:var(--text);font-weight:700;font-family:'JetBrains Mono',monospace;}
  .ghost-btn{
    width:100%;background:transparent;border:1px solid var(--line);
    padding:12px;color:var(--text-dim);font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .ghost-btn:hover{border-color:#54432f;color:var(--text);}

  .privacy-note{font-size:11px;color:var(--text-faint);text-align:center;margin:0 24px 26px;line-height:1.7;}

  /* public: check my application status */
  .status-check-link{
    display:block;margin:0 auto 28px;background:transparent;border:1px solid var(--line);
    color:var(--text-dim);font-size:12.5px;font-weight:600;padding:10px 18px;cursor:pointer;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  }
  .status-check-link:hover{border-color:var(--accent);color:var(--accent2);}
  .status-modal-bg{
    position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.72);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .status-modal{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);padding:22px;}
  .status-modal-head{display:flex;align-items:center;justify-content:space-between;color:var(--text);font-size:15px;font-weight:700;margin-bottom:16px;}
  .modal-x-amber{background:none;border:none;color:var(--text-faint);font-size:24px;line-height:1;cursor:pointer;padding:0;}
  .modal-x-amber:hover{color:var(--accent2);}
  .status-search-row{display:flex;gap:8px;margin-bottom:16px;}
  .status-search-row input{flex:1;font-family:'JetBrains Mono',monospace;letter-spacing:0.05em;}
  .status-search-row button{
    font-family:'Oswald',sans-serif;background:var(--accent);border:none;padding:0 18px;
    color:#1a1310;font-weight:700;font-size:13px;cursor:pointer;
  }
  .status-result-card{background:var(--bg2);border:1px solid var(--line);padding:16px 17px;}
  .status-badge-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .status-badge{font-family:'Oswald',sans-serif;font-size:12.5px;font-weight:700;padding:5px 12px;border:1px solid;letter-spacing:0.02em;}
  .status-badge.pending{color:#c9c2b4;background:rgba(255,255,255,0.04);border-color:#54432f;}
  .status-badge.approved{color:var(--ok);background:rgba(139,211,92,0.1);border-color:var(--ok);}
  .status-badge.rejected{color:var(--danger);background:rgba(226,86,74,0.1);border-color:var(--danger);}
  .status-result-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-soft);color:var(--text);}
  .status-result-row:last-child{border-bottom:none;}
  .status-result-row span:first-child{color:var(--text-dim);}
  .status-not-found{text-align:center;color:var(--text-faint);font-size:13px;padding:16px 0;}

  /* ---- admin: console styling, deliberately distinct from the form above ---- */
  .admin-dock{margin:0 16px;font-family:'JetBrains Mono',monospace;}
  .admin-toggle{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border:1px solid var(--console-dim);
    background:#0b0d0b;
    color:var(--console);font-size:12.5px;font-weight:600;cursor:pointer;
    letter-spacing:0.03em;
  }
  .admin-toggle:hover{border-color:var(--console);}
  .admin-toggle .lockflag::before{content:"[ ";}
  .admin-toggle .lockflag::after{content:" ]";}

  /* login modal */
  .admin-modal-bg{
    position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.72);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .admin-modal{
    width:100%;max-width:360px;background:#0b0d0b;border:1px solid var(--console-dim);
    padding:20px;font-family:'JetBrains Mono',monospace;
  }
  .admin-modal-head{display:flex;align-items:center;justify-content:space-between;color:var(--console);font-size:13px;font-weight:600;letter-spacing:0.03em;margin-bottom:16px;}
  .modal-x{background:none;border:none;color:var(--console-dim);font-size:22px;line-height:1;cursor:pointer;padding:0;}
  .modal-x:hover{color:var(--console);}
  .admin-login{display:flex;gap:8px;}
  .admin-login input{
    flex:1;background:#101410;border:1px solid var(--console-dim);color:var(--console);
    font-family:'JetBrains Mono',monospace;padding:11px 12px;font-size:13px;outline:none;
  }
  .admin-login input::placeholder{color:var(--console-dim);}
  .admin-login input:focus{border-color:var(--console);}
  .admin-login button{
    font-family:'JetBrains Mono',monospace;
    background:var(--console);border:none;padding:0 16px;color:#08130c;font-weight:600;font-size:12.5px;cursor:pointer;
  }
  .errmsg.console-err{font-family:'JetBrains Mono',monospace;margin-top:10px;}

  /* full-screen dashboard */
  .admin-overlay{
    position:fixed;inset:0;z-index:150;background:#090b09;
    overflow-y:auto;font-family:'JetBrains Mono',monospace;
    padding:18px 18px 60px;
  }
  .admin-overlay-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;background:#090b09;padding-bottom:14px;z-index:5;
  }
  .admin-overlay-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .admin-overlay-title > span:first-child{font-size:16px;font-weight:700;color:var(--console);letter-spacing:0.02em;}
  .admin-count{font-size:11.5px;color:var(--console-dim);border:1px solid var(--console-dim);padding:3px 9px;}
  .admin-actions{display:flex;gap:7px;align-items:center;}
  .small-btn{
    background:transparent;border:1px solid var(--console-dim);padding:8px 13px;color:var(--console);font-size:12px;font-weight:600;cursor:pointer;
    font-family:'JetBrains Mono',monospace;
  }
  .small-btn:hover{border-color:var(--console);color:#c8ffe0;}
  .modal-x{font-size:24px;}

  .filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .search-input{
    flex:1;min-width:160px;background:#0b0d0b;border:1px solid var(--console-dim);color:var(--console);
    font-family:'JetBrains Mono',monospace;padding:8px 12px;font-size:12.5px;outline:none;
  }
  .search-input::placeholder{color:var(--console-dim);}
  .search-input:focus{border-color:var(--console);}
  .filter-select{
    background:#0b0d0b;border:1px solid var(--console-dim);color:var(--console-dim);
    font-family:'JetBrains Mono',monospace;padding:8px 8px;font-size:11.5px;outline:none;cursor:pointer;
  }
  .filter-select:focus{border-color:var(--console);color:var(--console);}

  .sort-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .sort-label{font-size:11px;color:var(--console-dim);margin-right:2px;}
  .sort-btn{
    background:transparent;border:1px solid var(--console-dim);color:var(--console-dim);
    padding:7px 12px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:'JetBrains Mono',monospace;
  }
  .sort-btn.active{border-color:var(--console);color:var(--console);background:rgba(57,217,122,0.08);}
  .sort-btn:hover:not(.active){color:#c8ffe0;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid #14201a;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-faint);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* stats panel */
  /* tier settings panel */
  .tier-settings-panel{margin-bottom:18px;padding:14px 16px;background:#101410;border:1px solid var(--console-dim);}
  .tier-settings-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;}
  .tier-settings-field{display:flex;flex-direction:column;gap:5px;}
  .tier-settings-field label{font-size:10px;color:var(--console-dim);white-space:nowrap;}
  .tier-settings-field input{
    width:90px;background:#0b0d0b;border:1px solid var(--console-dim);color:var(--console);
    font-family:'JetBrains Mono',monospace;padding:8px 10px;font-size:13px;outline:none;
  }
  .tier-settings-field input:focus{border-color:var(--console);}
  #saveTierBtn{
    font-family:'JetBrains Mono',monospace;background:var(--console);border:none;
    padding:9px 16px;color:#08130c;font-weight:600;font-size:12px;cursor:pointer;height:35px;
  }

  .stats-panel{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid #14201a;}
  .stats-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .stat-chip{background:#101410;border:1px solid #1c2621;padding:9px 14px;min-width:96px;flex:1;}
  .stat-chip .num{font-size:19px;font-weight:700;color:var(--console);line-height:1.2;}
  .stat-chip .lbl{font-size:9.5px;color:var(--console-dim);margin-top:2px;letter-spacing:0.02em;}
  .stat-chip.warn .num{color:#e79a92;}
  .stat-chip.ok .num{color:var(--console);}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;}
  @media (max-width:420px){.stats-grid{grid-template-columns:1fr;}}
  .stats-block-title{font-size:11px;color:var(--console-dim);margin-bottom:8px;letter-spacing:0.03em;}
  .stat-bar-row{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:7px;}

// Edits the original Discord message to show it was deleted, instead of
// removing it outright — keeps a visible audit trail in the channel.
async function markDiscordMessageDeleted(entry, messageId){
  if(!DISCORD_WEBHOOK_URL || !messageId) return;
  try{
    const embed = {
      title: "🗑️ 삭제된 신청 / Deleted",
      color: 0x555555,
      description: `~~${entry.nickname || "-"} · ${entry.server || "-"} · UID ${entry.uid || "-"}~~`,
      timestamp: new Date().toISOString()
    };
    await fetch(`${DISCORD_WEBHOOK_URL}/messages/${messageId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ embeds: [embed] })
    });
  }catch(e){
    console.error("Discord edit-on-delete failed:", e);
  }
}
// Alternative: fully remove the message instead of marking it deleted.
// Swap the call in the delete handler from markDiscordMessageDeleted to
// this function if you'd rather have it disappear entirely.
async function deleteDiscordMessage(messageId){
  if(!DISCORD_WEBHOOK_URL || !messageId) return;
  try{
    await fetch(`${DISCORD_WEBHOOK_URL}/messages/${messageId}`, { method: "DELETE" });
  }catch(e){
    console.error("Discord delete failed:", e);
  }
}

let currentLang = "ko";
let selectedTroop = null;
let selectedAlliance = null;
let adminAuthed = false;

function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.ko[key] || key; }

function applyLang(){
  document.documentElement.lang = currentLang;
  document.querySelectorAll("[data-i]").forEach(el=>{
    el.textContent = t(el.getAttribute("data-i"));
  });
  document.querySelectorAll("[data-i-ph]").forEach(el=>{
    el.placeholder = t(el.getAttribute("data-i-ph"));
  });
  document.querySelectorAll(".langbtn").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang === currentLang);
  });
  document.getElementById("lockIcon").textContent = adminAuthed ? t("adminUnlocked") : t("adminLocked");
  renderLegend();
  if(typeof applyRecruitmentState === "function") applyRecruitmentState();
}

document.querySelectorAll(".langbtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentLang = btn.dataset.lang;
    applyLang();
  });
});

document.querySelectorAll(".troop-btn[data-troop]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const val = btn.dataset.troop;
    selectedTroop = (selectedTroop === val) ? null : val;
    document.querySelectorAll(".troop-btn[data-troop]").forEach(b=>{
      b.classList.toggle("selected", b.dataset.troop === selectedTroop);
    });
  });
});

document.querySelectorAll(".alliance-btn[data-alliance]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const val = btn.dataset.alliance;
    selectedAlliance = (selectedAlliance === val) ? null : val;
    document.querySelectorAll(".alliance-btn[data-alliance]").forEach(b=>{
      b.classList.toggle("selected", b.dataset.alliance === selectedAlliance);
    });
  });
});

const uidInput = document.getElementById("f_uid");
const uidCounter = document.getElementById("uidCounter");
uidInput.addEventListener("input", ()=>{
  uidInput.value = uidInput.value.replace(/[^0-9]/g,"").slice(0,16);
  uidCounter.textContent = uidInput.value.length + "/16";
  uidInput.classList.remove("invalid");
  document.getElementById("uidErr").classList.remove("show");
});

const powerInput = document.getElementById("f_power");
const scoreInput = document.getElementById("f_score");
scoreInput.addEventListener("input", ()=>{
  scoreInput.classList.remove("invalid");
  document.getElementById("scoreErr").classList.remove("show");
  updateScorePreview();
});

function updateScorePreview(){
  const previewEl = document.getElementById("scorePreview");
  const raw = scoreInput.value.trim();
  if(!raw){
    previewEl.classList.remove("show");
    return;
  }
  const v = parseScoreValue(raw);
  if(v === null){
    previewEl.classList.remove("show");
    return;
  }
  const tier = tierOf(raw);
  const tierNameKey = {s:"tierS", a:"tierA", b:"tierB", c:"tierC"}[tier];
  const displayNum = (Math.round(v*10)/10);
  previewEl.innerHTML = `${t("scorePreviewRecognized")}: <b>${displayNum}M</b> · ${t("scorePreviewGrade")}: <span class="tier-tag-${tier}">${t(tierNameKey)}</span>`;
  previewEl.classList.add("show");
}

function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 2200);
}

async function loadApplications(){
  try{
    const snap = await db.collection(COLLECTION).orderBy("submittedAt","desc").get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }catch(e){
    console.error("loadApplications failed:", e);
    return [];
  }
}
async function addApplication(entry){
  return await db.collection(COLLECTION).add(entry);
}
async function deleteApplication(id){
  await db.collection(COLLECTION).doc(id).delete();
}
async function updateApplicationStatus(id, status){
  await db.collection(COLLECTION).doc(id).update({status});
}
async function findByUid(uid){
  try{
    const snap = await db.collection(COLLECTION).where("uid","==",uid).limit(1).get();
    if(snap.empty) return null;
    const d = snap.docs[0];
    return { id: d.id, ...d.data() };
  }catch(e){
    console.error("findByUid failed:", e);
    return null;
  }
}

document.getElementById("submitBtn").addEventListener("click", async ()=>{
  if(recruitmentClosed){
    showToast(t("recruitmentClosedTitle"));
    applyRecruitmentState();
    return;
  }
  const nickname = document.getElementById("f_nickname").value.trim();
  const server = document.getElementById("f_server").value.trim();
  const uid = uidInput.value.trim();
  const power = powerInput.value.trim();
  const score = scoreInput.value.trim();

  let valid = true;
  if(uid.length !== 16){
    uidInput.classList.add("invalid");
    document.getElementById("uidErr").classList.add("show");
    valid = false;
  }
  if(!score){
    scoreInput.classList.add("invalid");
    document.getElementById("scoreErr").classList.add("show");
    valid = false;
  }
  if(!nickname || !server){ valid = false; }
  if(!valid){ showToast(t("requiredError")); return; }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  const originalText = submitBtn.textContent;
  submitBtn.textContent = "...";

  const existing = await findByUid(uid);
  if(existing){
    submitBtn.disabled = false;
    submitBtn.textContent = originalText;
    uidInput.classList.add("invalid");
    document.getElementById("uidErr").textContent = t("duplicateUidError");
    document.getElementById("uidErr").classList.add("show");
    showToast(t("duplicateUidError"));
    return;
  }

  const entry = {
    nickname, server, uid,
    troop: selectedTroop || "",
    alliance: selectedAlliance || "",
    power: power || "",
    score: score || "",
    status: "pending",
    submittedAt: new Date().toISOString(),
    lang: currentLang
  };

  try{
    const docRef = await addApplication(entry);
    (async ()=>{
      const msgId = await sendDiscordNotification(entry);
      if(msgId){
        try{ await db.collection(COLLECTION).doc(docRef.id).update({ discordMessageId: msgId }); }
        catch(e){ console.error("Failed to save discordMessageId:", e); }
      }
    })();

// Parses a free-text score like "20m", "1.2g", "500k", or a plain number
// into a comparable numeric value on a "million" scale.
// Adjust the k/m/g multipliers below if your server uses a different scale.
function parseScoreValue(str){
  if(!str) return null;
  const m = String(str).trim().toLowerCase().match(/^([\d.]+)\s*([kmgb]?)/);
  if(!m) return null;
  let num = parseFloat(m[1]);
  if(isNaN(num)) return null;
  const unit = m[2];
  if(unit === "k") num = num / 1000;
  else if(unit === "g" || unit === "b") num = num * 1000;
  else if(!unit && num >= 1000){
    // No unit was given, but the number is far too large to plausibly
    // already be "in millions" (e.g. someone typed the raw literal score
    // "63934827" instead of the intended "63.9m"). Treat it as an absolute
    // value and normalize it down to the million scale automatically.
    num = num / 1000000;
  }
  return num; // "m" or a small unitless number is treated as the base (million) scale
}

// Score tier thresholds (in the same "million" scale as parseScoreValue).
// These are just fallback defaults — the admin can edit and save real
// values from the dashboard's "등급 기준" panel, stored in Firestore.
let TIER_S_MIN = 280;
let TIER_A_MIN = 140;
let TIER_B_MIN = 90;
const TIER_CONFIG_COLLECTION = "config_224";
const TIER_CONFIG_DOC = "tiers";

async function loadTierConfig(){
  try{
    const doc = await db.collection(TIER_CONFIG_COLLECTION).doc(TIER_CONFIG_DOC).get();
    if(doc.exists){
      const d = doc.data();
      if(typeof d.s === "number") TIER_S_MIN = d.s;
      if(typeof d.a === "number") TIER_A_MIN = d.a;
      if(typeof d.b === "number") TIER_B_MIN = d.b;
    }
  }catch(e){
    console.error("loadTierConfig failed:", e);
  }
}
async function saveTierConfig(){
  await db.collection(TIER_CONFIG_COLLECTION).doc(TIER_CONFIG_DOC).set({s: TIER_S_MIN, a: TIER_A_MIN, b: TIER_B_MIN});
}

function renderLegend(){
  document.getElementById("legendTierS").textContent = `${t("tierS")} (>${TIER_S_MIN}M)`;
  document.getElementById("legendTierA").textContent = `${t("tierA")} (${TIER_A_MIN}~${TIER_S_MIN}M)`;
  document.getElementById("legendTierB").textContent = `${t("tierB")} (${TIER_B_MIN}~${TIER_A_MIN}M)`;
  document.getElementById("legendTierC").textContent = `${t("tierC")} (0~${TIER_B_MIN}M)`;
}

function tierOf(scoreStr){
  const v = parseScoreValue(scoreStr);
  if(v === null) return "c";
  if(v > TIER_S_MIN) return "s";
  if(v >= TIER_A_MIN) return "a";
  if(v >= TIER_B_MIN) return "b";
  return "c";
}

function renderStats(list){
  const panel = document.getElementById("statsPanel");
  const total = list.length;

  // tier breakdown
  const tierCounts = {s:0, a:0, b:0, c:0};
  list.forEach(e=>{
    tierCounts[tierOf(e.score)]++;
  });

  // troop breakdown
  const troopCounts = {fighter:0, shooter:0, rider:0, none:0};
  list.forEach(e=>{
    if(e.troop && troopCounts.hasOwnProperty(e.troop)) troopCounts[e.troop]++;
    else troopCounts.none++;
  });

  // preferred alliance breakdown
  const allianceCounts = {z3ro:0, owo:0, neco:0, kuon:0, none:0};
  list.forEach(e=>{
    if(e.alliance && e.alliance !== "tbd" && allianceCounts.hasOwnProperty(e.alliance)) allianceCounts[e.alliance]++;
    else allianceCounts.none++;
  });

  const tierRows = [
    ["s", tierCounts.s, "var(--tier-elite)", t("tierS")],
    ["a", tierCounts.a, "var(--tier-high)", t("tierA")],
    ["b", tierCounts.b, "var(--tier-mid)", t("tierB")],
    ["c", tierCounts.c, "var(--tier-low)", t("tierC")]
  ];
  const troopRows = [
    ["fighter", troopCounts.fighter, t("fighter")],
    ["shooter", troopCounts.shooter, t("shooter")],
    ["rider", troopCounts.rider, t("rider")],
    ["none", troopCounts.none, t("statsNoTroop")]
  ];
  const allianceRows = [
    ["z3ro", allianceCounts.z3ro, "Z3RO"],
    ["owo", allianceCounts.owo, "OWO"],
    ["neco", allianceCounts.neco, "NECO"],
    ["kuon", allianceCounts.kuon, "KUON"],
    ["none", allianceCounts.none, t("allianceTbd")]
  ];
  const maxTierCount = Math.max(1, ...tierRows.map(r=>r[1]));
  const maxTroopCount = Math.max(1, ...troopRows.map(r=>r[1]));
  const maxAllianceCount = Math.max(1, ...allianceRows.map(r=>r[1]));

  const tierBarsHtml = tierRows.map(([key,count,color,label])=>`
    <div class="stat-bar-row">
      <span class="stat-bar-label">${escapeHtml(label)}</span>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(count/maxTierCount*100)}%;background:${color};"></div></div>
      <span class="stat-bar-count">${count}</span>
    </div>`).join("");

  const troopBarsHtml = troopRows.map(([key,count,label])=>`
    <div class="stat-bar-row">
      <span class="stat-bar-label">${escapeHtml(label)}</span>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(count/maxTroopCount*100)}%;background:var(--console);"></div></div>
      <span class="stat-bar-count">${count}</span>
    </div>`).join("");

  const allianceBarsHtml = allianceRows.map(([key,count,label])=>`
    <div class="stat-bar-row">
      <span class="stat-bar-label">${escapeHtml(label)}</span>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(count/maxAllianceCount*100)}%;background:#3ec6ea;"></div></div>
      <span class="stat-bar-count">${count}</span>
    </div>`).join("");

  panel.innerHTML = `
    <div class="stats-summary">
      <div class="stat-chip">
        <div class="num">${total}</div>
        <div class="lbl">${t("statsTotal")}</div>
      </div>
    </div>
    <div class="stats-grid">
      <div>
        <div class="stats-block-title">${t("statsByTier")}</div>
        ${tierBarsHtml}
      </div>
      <div>
        <div class="stats-block-title">${t("statsByTroop")}</div>
        ${troopBarsHtml}
      </div>
      <div>
        <div class="stats-block-title">${t("statsByAlliance")}</div>
        ${allianceBarsHtml}
      </div>
    </div>
  `;
}

let lastList = [];

const ALLIANCE_LABELS = {z3ro:"Z3RO", owo:"OWO", neco:"NECO", kuon:"KUON"};
function allianceDisplay(key){
  if(!key) return "";
  if(key === "tbd") return t("allianceTbd");
  return ALLIANCE_LABELS[key] || key;
}

async function refreshAdminList(){
  const list = await loadApplications();
  lastList = list;
  renderFilteredList();

// kept as an alias since existing callers use this name
async function renderAdminList(){
  await refreshAdminList();
}

function renderFilteredList(){
  const list = lastList;
  const container = document.getElementById("adminList");

  // duplicate UID detection is based on the FULL list, regardless of filters
  const uidCounts = {};
  list.forEach(e=>{ uidCounts[e.uid] = (uidCounts[e.uid] || 0) + 1; });

  // apply search + filters
  const q = searchQuery.trim().toLowerCase();
  let filtered = list.filter(e=>{
    if(q){
      const inNickname = String(e.nickname||"").toLowerCase().includes(q);
      const inUid = String(e.uid||"").toLowerCase().includes(q);
      if(!inNickname && !inUid) return false;
    }
    if(filterTier !== "all" && tierOf(e.score) !== filterTier) return false;
    if(filterTroop !== "all"){
      const tv = e.troop || "none";
      if(tv !== filterTroop) return false;
    }
    if(filterAlliance !== "all"){
      const av = (e.alliance && e.alliance !== "tbd") ? e.alliance : "none";
      if(av !== filterAlliance) return false;
    }
    if(filterStatus !== "all"){
      const sv = e.status || "pending";
      if(sv !== filterStatus) return false;
    }
    return true;
  });

  const suffix = currentLang==="ko" ? "건" : currentLang==="ja" ? "件" : currentLang==="zh" ? "件" : "";
  document.getElementById("adminCount").textContent = filtered.length + "/" + list.length + suffix;
  renderStats(filtered);

  if(!filtered.length){
    container.innerHTML = '<div class="empty-state"></div>';
    container.querySelector(".empty-state").textContent = t("adminEmpty");
    return;
  }

  if(sortMode === "time_desc"){
    filtered.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
  } else {
    filtered.sort((a,b)=>{
      const va = parseScoreValue(a.score);
      const vb = parseScoreValue(b.score);
      if(va === null && vb === null) return 0;
      if(va === null) return 1;
      if(vb === null) return -1;
      return sortMode === "score_asc" ? (va - vb) : (vb - va);
    });
  }

  container.innerHTML = "";
  filtered.forEach(entry=>{
    const tier = tierOf(entry.score);
    const troopLabel = entry.troop ? t(entry.troop) : t("notSet");
    const powerLabel = entry.power || t("notSet");
    const allianceLabel = entry.alliance ? allianceDisplay(entry.alliance) : "";
    const status = entry.status || "pending";
    const isDup = uidCounts[entry.uid] > 1;
    const card = document.createElement("div");
    card.className = "app-card tier-" + tier + "-card" + (isDup ? " dup-uid" : "");
    card.innerHTML = `
      <div class="app-card-top">
        <div class="app-name-wrap">
          <span class="app-nickname">${escapeHtml(entry.nickname)}</span>
          <span class="app-server-tag">${escapeHtml(entry.server)}</span>
          ${allianceLabel ? `<span class="app-alliance-tag">${escapeHtml(allianceLabel)}</span>` : ""}
          ${isDup ? `<span class="app-dup-tag">${t("dupUidTag")}</span>` : ""}
        </div>
        <div class="app-score-badge tier-${tier}">${escapeHtml(entry.score || t("notSet"))}</div>
      </div>
      <div class="app-meta" title="UID ${escapeHtml(entry.uid)} / ${escapeHtml(troopLabel)} / ${escapeHtml(powerLabel)}">
        UID <b>${escapeHtml(entry.uid)}</b><span class="sep">·</span><b>${escapeHtml(troopLabel)}</b><span class="sep">·</span><b>${escapeHtml(powerLabel)}</b>
      </div>
      <div class="app-card-foot">
        <span class="app-time">${fmtTime(entry.submittedAt)}</span>
        <div class="app-foot-actions">
          <select class="status-select status-${status}" data-id="${entry.id}">
            <option value="pending" ${status==="pending"?"selected":""}>${t("statusPending")}</option>
            <option value="approved" ${status==="approved"?"selected":""}>${t("statusApproved")}</option>
            <option value="rejected" ${status==="rejected"?"selected":""}>${t("statusRejected")}</option>
          </select>
          <button class="del-btn" data-id="${entry.id}">${t("adminDelete")}</button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });

  container.querySelectorAll(".del-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(!confirm(t("deleteConfirm"))) return;
      const id = btn.dataset.id;
      const entry = lastList.find(e => e.id === id);
      await deleteApplication(id);
      if(entry && entry.discordMessageId){
        markDiscordMessageDeleted(entry, entry.discordMessageId); // fire and forget
      }
      showToast(t("deleted"));
      await renderAdminList();
    });
  });

  container.querySelectorAll(".status-select").forEach(sel=>{
    sel.addEventListener("change", async ()=>{
      const id = sel.dataset.id;
      const newStatus = sel.value;
      sel.disabled = true;
      try{
        await updateApplicationStatus(id, newStatus);
        showToast(t("statusUpdated"));
        await renderAdminList();
      }catch(e){
        showToast("Error: " + e.message);
        sel.disabled = false;
      }
    });
  });
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

document.getElementById("copyCsvBtn").addEventListener("click", async ()=>{
  const list = await loadApplications();
  list.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
  const header = ["nickname","server","uid","troop","alliance","power","score","submittedAt"];
  const lines = [header.join(",")];
  list.forEach(e=>{
    const row = [e.nickname, e.server, e.uid, e.troop, e.alliance, e.power, e.score, e.submittedAt]
      .map(v => '"' + String(v||"").replace(/"/g,'""') + '"');
    lines.push(row.join(","));
  });
  const csv = lines.join("\\n");
  try{
    await navigator.clipboard.writeText(csv);
    showToast(t("adminCopied"));
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = csv;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showToast(t("adminCopied"));
  }
});
